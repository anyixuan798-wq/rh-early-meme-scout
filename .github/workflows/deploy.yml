name: build-and-deploy

on:
  push:
    branches: [main]
  schedule:
    # Refresh the stock-token snapshot 4x a day (RH API has no CORS headers,
    # so browsers can't fetch it live; the Actions runner can).
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh stock-token snapshot
        run: node scripts/fetch-stocks.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
